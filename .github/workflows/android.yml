name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # 1. Genera un keystore JKS fijo (evita el error PKCS12)
      - name: Generate JKS Keystore
        run: |
          keytool -genkey -v -keystore app/debug.keystore -storepass android123 -alias androiddebugkey -keypass android123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype JKS

      # 2. Muestra el SHA-1 en los logs para que lo copies a Firebase
      - name: Show SHA-1 Fingerprint
        run: |
          keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android123 | grep "SHA1:"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: eisenhower-widget-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
