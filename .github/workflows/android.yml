name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # DESCARGA UNA FIRMA FIJA Y PERMANENTE
      - name: Download Fixed Debug Keystore
        run: |
          wget -O app/debug.keystore https://raw.githubusercontent.com/facebook/react-native/main/packages/react-native/template/android/app/debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: eisenhower-widget-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
